[package]
name = "wlsctx"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4.5.48", features = ["derive", "env"] }
env_logger = "0.11.8"
log = "0.4.28"
nix = { version = "0.30.1", features = ["signal", "process"] }
sd-notify = "0.4.5"
wayland-client = "0.31.11"
wayland-protocols = { version = "0.32.9", features = ["client", "staging"] }
xdg = "3.0.0"
