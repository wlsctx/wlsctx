[package]
name = "wlsctx"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4.6.7", features = ["derive", "env"] }
env_logger = "0.11.11"
log = "0.4.34"
nix = { version = "0.31.3", features = ["signal", "process"] }
sd-notify = "0.5.0"
# Direct dependency (not just transitive): the bounded roundtrip polls
# the upstream Wayland socket with poll(2) against a deadline.
libc = "0.2"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
xdg = "3.0.0"
