[package]
name = "wlsctx"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4.6.7", features = ["derive", "env"] }
env_logger = "0.11.11"
# Direct dependency (not just transitive): the bounded roundtrip polls
# the upstream Wayland socket with poll(2) against a deadline.
libc = "0.2"
log = "0.4.34"
nix = { version = "0.31.3", features = ["signal", "process"] }
# Landlock + seccomp confinement for the sandboxed app (PLAN.md phase 4).
# default-features off: drops the system-keyring integration, which the
# sandbox does not use.
nono = { version = "0.80.0", default-features = false }
sd-notify = "0.5.0"
# App-profile serialization (PLAN.md phase 3).
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
wayland-client = "0.31.15"
# Session-bus D-Bus client for the transient systemd scope (PLAN.md
# phase 6, #35). The one-shot call happens in the single-threaded
# pre-fork part of the supervisor, via `zbus::blocking`. v5 for now:
# 6.0.0 (2026-10-16) reworked the runtime API (`zbus::block_on`,
# async-only `call_method`) — migrating is a later, small task.
# `blocking-api` is the feature gate for the `zbus::blocking` module in v5
# (not `blocking`, which is an optional *dependency*).
zbus = { version = "5", default-features = false, features = ["blocking-api", "tokio"] }
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
xdg = "3.0.0"
