[Container]
User=0
Group=0
ReadOnly=
NoNewPrivileges=
DropCapability=
# --ipc=host is kept here (and only here): the debug container is a root
# escape hatch for inspecting a running pod, and sharing the host /dev/shm
# and IPC namespace is intentional for that. App containers must not do
# this — they only get the pod's private IPC namespace.
PodmanArgs=--ipc=host
