# Per-app D-Bus proxy arguments for the wl-dbus@ sidecar (see the
# DBUS_PROXY_EXTRA_ARGS comment in wl-dbus@.container).
#
# Allow Librewolf to own its own names on the filtered session-bus proxy.
# Previously this was hardcoded in the shared wl-dbus@.container unit.
[Service]
Environment=DBUS_PROXY_EXTRA_ARGS=--own=io.gitlab.librewolf.*
