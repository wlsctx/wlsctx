[Container]
# No --ipc=host: containers in the same pod already share the pod's IPC
# namespace (including its /dev/shm), which is what X11 MIT-SHM and Vulkan
# cross-process semaphores need. --ipc=host would additionally share the
# *host's* /dev/shm and IPC namespace with the sandbox, so it was removed
# from app and xwayland containers; only the root debug container keeps it.
AddDevice=-/dev/dri/renderD128
AddDevice=-/dev/dri/renderD129
AddDevice=-/dev/dri/renderD130
AddDevice=-/dev/dri/renderD131
